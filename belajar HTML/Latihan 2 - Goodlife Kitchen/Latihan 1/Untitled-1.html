<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1 - Tabel</title>
</head>

<body style="font-family: Arial, sans-serif;">

    <h1 style="text-align: center; color: #333;">
        Latihan 1 - Tabel
    </h1>

    <table
        border="1"
        cellpadding="10"
        cellspacing="0"
        style="width: 80%; margin: 30px auto; border-collapse: collapse; text-align: center;"
    >

        <tr style="background-color: #b8b1ee;">
            <th rowspan="2">No.</th>
            <th rowspan="2">Nama</th>
            <th colspan="2">Nilai</th>
        </tr>

        <tr style="background-color: #ffd9c9;">
            <th>HTML</th>
            <th>CSS</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Joant</td>
            <td>90</td>
            <td>85</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Andi</td>
            <td>80</td>
            <td>88</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Budi</td>
            <td>85</td>
            <td>90</td>
        </tr>

        <tr style="background-color: #e8e8e8;">
            <td colspan="2"><strong>Rata-rata</strong></td>
            <td><strong>85</strong></td>
            <td><strong>87.6</strong></td>
        </tr>

    </table>

</body>
</html>
